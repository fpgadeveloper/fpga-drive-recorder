# FPGA Drive Recorder kernel configuration fragment

# AXI DMA through the xilinx_dma dmaengine driver (S2MM channel)
CONFIG_DMADEVICES=y
CONFIG_DMA_ENGINE=y
CONFIG_XILINX_DMA=y

# 2 MB hugepages for the recording buffers (hugepagesz=2M hugepages=N)
CONFIG_HUGETLBFS=y
CONFIG_HUGETLB_PAGE=y

# io_uring for the fdrec recorder
CONFIG_IO_URING=y

# RAID0 across two NVMe SSDs (fdsetup-raid0.sh)
CONFIG_MD=y
CONFIG_BLK_DEV_MD=y
CONFIG_MD_RAID0=y

# XFS, the default filesystem of fdsetup-raid0.sh (ext4 is in the base config)
CONFIG_XFS_FS=y
