# meta-fdrec: FPGA Drive Recorder layer (fdrec kernel driver, recorder apps,
# kernel config fragment, image additions). Enabled per board by listing
# Yocto/meta-fdrec in Yocto/bsp/<board>/bblayers-extra.txt.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-fdrec"
BBFILE_PATTERN_meta-fdrec = "^${LAYERDIR}/"
# Below meta-user (7) so a board's meta-user can override anything here.
BBFILE_PRIORITY_meta-fdrec = "6"
LAYERSERIES_COMPAT_meta-fdrec = "scarthgap"
LAYERDEPENDS_meta-fdrec = "core openembedded-layer"

# Repo root (Yocto/meta-fdrec/../..): the recipes take their sources from
# sw/ and include/ in this repository rather than from a fetched tarball.
FDREC_REPO_ROOT := "${@os.path.normpath(os.path.join('${LAYERDIR}', '..', '..'))}"
